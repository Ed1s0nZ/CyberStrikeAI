name: "katana"
command: "katana"
enabled: true
short_description: "下一代Web爬虫和蜘蛛工具"
description: |
  Katana是一个快速、智能的Web爬虫工具，用于发现Web应用中的端点和资源。

  **主要功能：**
  - 智能Web爬虫
  - JavaScript渲染支持
  - 表单提取
  - 端点发现

  **使用场景：**
  - Web应用侦察
  - 端点发现
  - 内容爬取
  - 安全测试
parameters:
  - name: "url"
    type: "string"
    description: "目标URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "爬取深度"
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "启用JavaScript爬取"
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "启用表单提取（-fx / -form-extraction）"
    required: false
    flag: "-fx"
    format: "flag"
    default: true
  - name: "proxy"
    type: "string"
    description: |
      HTTP/SOCKS代理地址，用于通过代理爬取目标。
      仅在需要走代理访问目标时填写，内网/直连目标请留空。
      示例：http://127.0.0.1:7891
    required: false
    flag: "-proxy"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外的Katana参数。用于传递未在参数列表中定义的Katana选项。

      **示例值：**
      - "-headless": 使用无头浏览器
      - "-output-template '{{url}}'": 自定义输出格式
      - "-output output.txt": 输出到文件
      - "-c 20": 并发数

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
