name: "execute-python-script"
command: "powershell"
args:
  - "-NoProfile"
  - "-Command"
  - "$ErrorActionPreference='Stop'; $script = $null; $envName = 'default'; $extra = ''; for ($i = 0; $i -lt $args.Count; $i++) { switch ($args[$i]) { '--script' { if ($i+1 -lt $args.Count) { $script = $args[$i+1]; $i++ } }; '--env_name' { if ($i+1 -lt $args.Count) { $envName = $args[$i+1]; $i++ } }; '--additional_args' { if ($i+1 -lt $args.Count) { $extra = $args[$i+1]; $i++ } } } }; if (-not $script) { Write-Output '错误: 缺少 --script 参数'; exit 2 }; $root = $env:CYBERSTRIKE_ROOT; if (-not $root) { $root = (Get-Location).Path }; $venvDir = Join-Path $root 'venv'; if ($envName -ne 'default') { $venvDir = Join-Path $env:HOME (Join-Path '.cyberstrike' (Join-Path 'venvs' $envName)) }; $py = Join-Path $venvDir 'Scripts\\python.exe'; if (-not (Test-Path $py)) { $py = 'python' }; $tmp = Join-Path $env:TEMP ('script_' + [guid]::NewGuid().ToString() + '.py'); [System.IO.File]::WriteAllText($tmp, $script, [System.Text.Encoding]::UTF8); try { if ($extra) { & $py $tmp $extra } else { & $py $tmp }; exit $LASTEXITCODE } finally { Remove-Item $tmp -ErrorAction SilentlyContinue }"
  - "_"
enabled: true
short_description: "在虚拟环境中执行Python脚本（参数：--script 代码, --env_name 环境名, --additional_args 附加参数）"
