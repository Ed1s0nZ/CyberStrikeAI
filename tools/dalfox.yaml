name: "dalfox"
command: "dalfox"
# dalfox v3 使用子命令，单目标模式为 `dalfox scan <target>`（v2 的 `url` 子命令已移除；
# 根级不带子命令时不接受任何 options，必须显式 scan）

args:
  - "scan"
enabled: true
short_description: "高级XSS漏洞扫描器"
description: |
  Dalfox是一个高级XSS漏洞扫描器，支持多种XSS检测技术。

  **主要功能：**
  - XSS漏洞检测
  - 盲XSS测试
  - DOM挖掘
  - 字典挖掘

  **使用场景：**
  - XSS漏洞测试
  - Web应用安全测试
  - Bug bounty侦察
  - 安全测试
parameters:
  - name: "url"
    type: "string"
    description: |
      目标URL。作为 scan 子命令后的第一个位置参数传入。
      示例等价 CLI：dalfox scan "http://target/page?q=test"
    required: true
    position: 0
    format: "positional"
  - name: "input_type"
    type: "string"
    description: |
      输入类型（v3 的 --input-type，替代 v2 的 --pipe）：auto/url/file/pipe/raw-http/har。
      管道模式输入传 pipe。默认 auto。
    required: false
    flag: "--input-type"
    format: "flag"
  - name: "blind"
    type: "string"
    description: "盲XSS回调地址（例如Burp Collaborator URL）"
    required: false
    flag: "--blind"
    format: "flag"
  - name: "skip_mining_dom"
    type: "bool"
    description: "跳过DOM挖掘（v3 默认启用 DOM 挖掘，传 true 时渲染 --skip-mining-dom）"
    required: false
    flag: "--skip-mining-dom"
    format: "flag"
    default: false
  - name: "skip_mining_dict"
    type: "bool"
    description: "跳过字典挖掘（v3 默认启用字典挖掘，传 true 时渲染 --skip-mining-dict）"
    required: false
    flag: "--skip-mining-dict"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      额外的dalfox参数。用于传递未在参数列表中定义的dalfox选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
