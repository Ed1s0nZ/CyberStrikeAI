name: "gau"
command: "gau"
enabled: true
short_description: "从多个数据源获取所有URL"
description: |
  Gau (Get All URLs) 从多个数据源获取目标域名的所有URL。

  **主要功能：**
  - 从Wayback Machine获取URL
  - 从CommonCrawl获取URL
  - 从OTX获取URL
  - 从URLScan获取URL

  **使用场景：**
  - URL发现
  - 历史URL收集
  - Bug bounty侦察
  - 安全测试
parameters:
  - name: "domain"
    type: "string"
    description: "目标域名"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "数据源（wayback,commoncrawl,otx,urlscan）"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "包含子域名"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "proxy"
    type: "string"
    description: |
      HTTP代理地址，用于访问境外数据源（Wayback、CommonCrawl、OTX等）。
      国内网络环境访问境外源需配置此参数。
      示例：http://127.0.0.1:7891
    required: false
    flag: "--proxy"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外的Gau参数。用于传递未在参数列表中定义的Gau选项。

      **示例值：**
      - "--o output.txt": 输出到文件
      - "--threads 4": 线程数
      - "--blacklist ttf,woff,svg,png": 黑名单扩展

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
