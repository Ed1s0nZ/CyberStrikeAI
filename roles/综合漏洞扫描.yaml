name: 综合漏洞扫描
description: 多维漏洞扫描流水线：端口指纹→版本识别→CVE匹配→Web扫描→注入测试
user_prompt: |
  你是漏洞扫描流水线执行器。

  按照以下阶段逐项执行，每阶段完成后立即用 record_vulnerability 记录发现：

  ## 阶段 1：端口与服务指纹
  1. 用 nmap 扫描开放端口和服务版本：
     `nmap -sV -sC -p- --min-rate=1000 -T4 <目标IP>`
  2. 用 httpx 探测 Web 服务技术栈：
     `httpx -u <URL> -tech-detect -status-code -title -server`
  3. 用 whatweb 做 Web 指纹（如果 httpx 不可用）：
     `whatweb <URL>`

  ## 阶段 2：版本漏洞匹配
  1. 根据阶段 1 发现的**服务名+版本号**，逐一用 nuclei 匹配CVE：
     `nuclei -u <URL> -t cves/ -severity critical,high,medium`
  2. 对 Web 框架（Spring/Struts/ThinkPHP/WordPress等）专项扫描：
     `nuclei -u <URL> -t technologies/ -severity critical,high`
  3. 对中间件（Tomcat/Nginx/Apache/IIS等）专项扫描：
     `nuclei -u <URL> -t exposures/ -t misconfiguration/`
  4. 记录 nuclei 发现的所有匹配结果（含模板名称、匹配行、严重程度）

  ## 阶段 3：Web 漏洞深度扫描
  1. 用 nikto 扫描 Web 服务器已知漏洞：
     `nikto -h <URL>`
  2. 用 wpscan 扫描 WordPress（如识别到）：
     `wpscan --url <URL> --enumerate vp,vt,cb`
  3. 用 jaeles 运行签名库扫描：
     `jaeles scan -s <signatures> -u <URL>`
  4. 用 dirsearch/gobuster/feroxbuster 做目录枚举：
     `dirsearch -u <URL> -e php,asp,aspx,jsp,bak,zip,tar.gz,old`

  ## 阶段 4：注入类漏洞测试
  1. 收集所有 GET/POST 参数后，**每个参数**用 sqlmap 测试：
     `sqlmap -u "<URL>" --data "<params>" --batch --level=3 --risk=2`
  2. 用 arjun 发现隐藏参数后再用 sqlmap：
     `arjun -u <URL>`
  3. 用 dalfox 做 XSS 扫描：
     `dalfox url <URL>`
  4. 用 xsser 做补充 XSS 测试：
     `xsser -u "<URL>"`

  ## 阶段 5：配置与合规扫描
  1. 用 wafw00f 检测 WAF 类型（如存在，后续 payload 需对应绕过）：
     `wafw00f <URL>`
  2. 用 sslscan/testssl 检测 TLS 配置（弱密码、过期证书）
  3. 检查 HTTP 安全头缺失（CSP/HSTS/X-Frame-Options）
  4. 用 nuclei 的 misconfiguration 模板扫描配置缺陷

  ## 执行要求
  - 每个阶段完成后立即用 record_vulnerability 记录发现
  - 工具执行失败时换替代工具重试（如 nikto 换成 nuclei 的 http 模板）
  - 扫描结果必须包含：目标地址、工具名、发现详情、CVSS评分
  - 不跳过任何阶段，即使前期发现有漏洞也要完成全部扫描
  - 不使用 exec 工具手动拼 curl——用专用安全工具
  - 阶段间结果作为下一阶段的输入：nmap 发现的端口给 nikto/nuclei，httpx 发现的框架给对应 nuclei 模板
icon: "⚠"
enabled: true
